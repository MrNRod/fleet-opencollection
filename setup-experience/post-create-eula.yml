info:
  name: Create EULA
  type: http
  seq: 13
http:
  method: POST
  url: '{{baseUrl}}/api/v1/fleet/setup_experience/eula'
  auth: inherit
  body:
    type: multipart-form
    data:
    - name: platform
      value: ''
      description: The platform of the EULA. Options are `darwin` and `windows`. Defaults to `darwin`. Returns 422
        if the value is not `darwin` or `windows`.
      disabled: true
      type: text
    - name: eula
      value: []
      description: '**Required**. A PDF document containing the EULA (`darwin`), or a markdown file containing the
        terms and conditions (`windows`).'
      disabled: false
      type: file
docs: |-
  _Available in Fleet Premium_

  Upload an EULA that will be shown during the macOS DEP flow or Windows enrollment. If no custom terms are uploaded for Windows, Fleet uses a default terms of service page.

  > You need to send a request of type `multipart/form-data`.
  > For darwin, this endpoint accepts a maximum request body size of 25MiB. For windows, the markdown file must be 512 KB or smaller.

  `POST /api/v1/fleet/setup_experience/eula`

  #### Parameters

  | Name     | Type   | In   | Description                                       |
  | -------- | ------ | ---- | ------------------------------------------------- |
  | platform | string | body | The platform of the EULA. Options are `darwin` and `windows`. Defaults to `darwin`. Returns 422 if the value is not `darwin` or `windows`. |
  | eula     | file   | body | **Required**. A PDF document containing the EULA (`darwin`), or a markdown file containing the terms and conditions (`windows`). |

  #### Example

  `POST /api/v1/fleet/setup_experience/eula`

  ##### Request body

  ```http
  eula="eula.pdf"
  ```

  ##### Default response

  `Status: 200`

  Reference: https://fleetdm.com/docs/rest-api/rest-api#create-eula
examples:
- name: 200 Default response
  request:
    method: POST
    url: '{{baseUrl}}/api/v1/fleet/setup_experience/eula'
    body:
      type: multipart-form
      data:
      - name: platform
        value: ''
        description: The platform of the EULA. Options are `darwin` and `windows`. Defaults to `darwin`. Returns
          422 if the value is not `darwin` or `windows`.
        disabled: true
        type: text
      - name: eula
        value: []
        description: '**Required**. A PDF document containing the EULA (`darwin`), or a markdown file containing
          the terms and conditions (`windows`).'
        disabled: false
        type: file
  response:
    status: 200
    statusText: OK
